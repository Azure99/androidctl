[versions]
agp = "8.13.2"
kotlin = "2.3.10"
ktlint = "1.3.1"
ktlintGradle = "14.1.0"
detekt = "1.23.8"
coreKtx = "1.18.0"
junit = "4.13.2"
activityCompose = "1.13.0"
composeBom = "2026.03.00"
json = "20251224"
slf4j = "2.0.13"
websocket = "1.6.0"

shizuku = "13.1.5"

bouncycastle = "1.81"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
json = { group = "org.json", name = "json", version.ref = "json" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
websocket = { group = "org.java-websocket", name = "Java-WebSocket", version.ref = "websocket" }

shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }

shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }

bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
