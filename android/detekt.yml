console-reports:
  exclude:
    - "ProjectStatisticsReport"
    - "ComplexityReport"
    - "NotificationReport"

complexity:
  LongMethod:
    excludes: &test-excludes
      - &src-test-exclude "**/src/test/**"
  LongParameterList:
    excludes: *test-excludes
  LargeClass:
    threshold: 500
    excludes: *test-excludes
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - IllegalMonitorStateException
      - IndexOutOfBoundsException
      - NullPointerException
      - RuntimeException
      - Throwable

style:
  MagicNumber:
    excludes:
      - *src-test-exclude
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  WildcardImport:
    active: false
