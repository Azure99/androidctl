version: '3'

includes:
  android:
    taskfile: ./android/Taskfile.yml
    dir: ./android
  python:
    taskfile: ./androidctl/Taskfile.yml
    dir: .

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
  test:
    desc: Run host and Android tests
    deps:
      - task: android:test
      - task: python:test
  lint:
    desc: Run linters and static checks across all modules
    deps:
      - task: android:lint
      - task: python:lint
  format:
    desc: Auto-format code across all modules
    deps:
      - task: android:format
      - task: python:format
  quality:
    desc: Run host and Android quality gates
    deps:
      - task: android:quality
      - task: python:quality

  release:android:
    desc: Build, stage and verify the Android APK candidate
    cmds:
      - task: android:build:release
      - python -m tools.release.android_release prepare

  release:pypi:
    desc: Build and verify the Android APK, wheel and sdist with a clean wheel install
    cmds:
      - task: android:build:release
      - python -m tools.release.pypi_release prepare
