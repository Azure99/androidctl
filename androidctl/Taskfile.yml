version: '3'

tasks:
  test:
    desc: Run androidctl tests
    cmds:
      - python -m pytest

  lint:
    desc: Run androidctl lint and type checks
    cmds:
      - ruff check androidctl/src androidctl/tests tools/release
      - ruff format --check androidctl/src androidctl/tests tools/release
      - mypy androidctl/src tools/release

  format:
    desc: Auto-format androidctl sources
    cmds:
      - ruff check --fix androidctl/src androidctl/tests tools/release
      - ruff format androidctl/src androidctl/tests tools/release

  quality:
    desc: Run androidctl quality gate
    cmds:
      - task: lint
      - task: test
