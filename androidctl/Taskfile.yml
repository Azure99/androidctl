version: '3'

vars:
  PYTHON_SOURCES: androidctl/src androidctl/tests tools/release

tasks:
  test:
    desc: Run host, CLI process and release tooling tests
    cmds:
      - python -m pytest
  lint:
    desc: Check Python sources
    cmds:
      - python -m ruff check {{.PYTHON_SOURCES}}
      - python -m ruff format --check {{.PYTHON_SOURCES}}
      - python -m mypy
  format:
    desc: Format Python sources
    cmds:
      - python -m ruff check --fix {{.PYTHON_SOURCES}}
      - python -m ruff format {{.PYTHON_SOURCES}}
  quality:
    desc: Run Python lint, type checks, and behavior tests
    cmds:
      - task: lint
      - task: test
  ci:
    desc: Run Python quality and cross-platform type checks
    cmds:
      - task: quality
      - python -m mypy --platform linux
      - python -m mypy --platform darwin
